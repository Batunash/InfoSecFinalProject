apiVersion: v1
kind: Service
metadata:
  name: devsecops-app-service
  namespace: production
  labels:
    app: devsecops-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: devsecops-app
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 5000
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-app-internal
  namespace: production
  labels:
    app: devsecops-app
spec:
  type: ClusterIP
  selector:
    app: devsecops-app
  ports:
  - name: http
    protocol: TCP
    port: 5000
    targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsecops-app-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst: "20"
spec:
  tls:
  - hosts:
    - devsecops.example.com
    secretName: devsecops-tls
  rules:
  - host: devsecops.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devsecops-app-internal
            port:
              number: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devsecops-app-config
  namespace: production
data:
  app.conf: |
    FLASK_ENV=production
    LOG_LEVEL=INFO
    MAX_CONTENT_LENGTH=16777216
