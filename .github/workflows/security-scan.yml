name: Security Scanning

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      run-dast:
        description: 'Run DAST scan'
        required: false
        default: 'true'
      run-iac:
        description: 'Run IaC scan'
        required: false
        default: 'true'
      run-dependency:
        description: 'Run dependency scan'
        required: false
        default: 'true'

jobs:
  dast:
    name: Dynamic Application Security Testing
    runs-on: ubuntu-latest
    if: github.event.inputs.run-dast != 'false'
    services:
      app:
        image: python:3.11-slim
        ports:
          - 5000:5000
        options: >-
          --name test-app
          --health-cmd "curl -f http://localhost:5000/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build and run application
        run: |
          cd app
          docker build -t test-app .
          docker run -d -p 5000:5000 --name test-app test-app

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:5000/health; do sleep 2; done'

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline-scan@v0.7.0
        with:
          target: 'http://localhost:5000'
          rules_file_name: 'zap-rules.tsv'
          cmd_options: '-a'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: report_html.html

      - name: Cleanup
        if: always()
        run: |
          docker stop test-app || true
          docker rm test-app || true

  iac-scan:
    name: Infrastructure as Code Security Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.run-iac != 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          framework: terraform,kubernetes
          output_format: sarif
          output_file_path: 'checkov-results.sarif'
          soft_fail: true

      - name: Upload Checkov results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'checkov-results.sarif'

      - name: Upload Checkov results as artifact
        uses: actions/upload-artifact@v3
        with:
          name: checkov-results
          path: checkov-results.sarif

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.run-dependency != 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'devsecops-app'
          path: 'app/'
          format: 'HTML'
          out: 'dependency-check-report'
          suppressionFile: 'security/dependency-suppressions.xml'
          failOnCVSS: 7
        continue-on-error: true

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: dependency-check-report

      - name: Run Snyk security scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk-results.sarif
          command: test

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'snyk-results.sarif'

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config-path: 'security/gitleaks-config.toml'

  license-scan:
    name: License Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          cd app
          pip-audit --format json --output pip-audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v3
        with:
          name: pip-audit-report
          path: app/pip-audit-report.json

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dast, iac-scan, dependency-scan, secret-scan, license-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| DAST (OWASP ZAP) | ${{ needs.dast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC (Checkov) | ${{ needs.iac-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency (OWASP DC) | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret (Gitleaks) | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License (pip-audit) | ${{ needs.license-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- ZAP Report: \`zap-report\`" >> $GITHUB_STEP_SUMMARY
          echo "- Checkov Results: \`checkov-results\`" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Check: \`dependency-check-report\`" >> $GITHUB_STEP_SUMMARY
          echo "- pip-audit Report: \`pip-audit-report\`" >> $GITHUB_STEP_SUMMARY

      - name: Create security issue on failure
        if: |
          needs.dast.result == 'failure' ||
          needs.iac-scan.result == 'failure' ||
          needs.dependency-scan.result == 'failure' ||
          needs.secret-scan.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security Scan Failed - ${new Date().toISOString()}`,
              body: `Security scan failed. Please review the workflow run for details.\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security', 'automated']
            })
