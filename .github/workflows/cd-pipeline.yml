name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/devsecops-app
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan on pushed image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/devsecops-app:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://devsecops.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubernetes credentials
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update Kubernetes deployment
        run: |
          # Update image tag in deployment
          kubectl set image deployment/devsecops-app \
            app=${{ secrets.DOCKER_USERNAME }}/devsecops-app:${{ github.sha }} \
            --namespace=production

      - name: Wait for deployment to be ready
        run: |
          kubectl rollout status deployment/devsecops-app \
            --namespace=production \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -l app=devsecops-app --namespace=production
          kubectl get deployment devsecops-app --namespace=production

      - name: Get deployment logs
        if: failure()
        run: |
          kubectl logs -l app=devsecops-app --namespace=production --tail=50

  deploy-terraform:
    name: Deploy with Terraform
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform Init
        run: |
          cd infrastructure/terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd infrastructure/terraform
          terraform plan -out=tfplan \
            -var="docker_image=${{ secrets.DOCKER_USERNAME }}/devsecops-app:${{ github.sha }}"

      - name: Terraform Apply
        run: |
          cd infrastructure/terraform
          terraform apply -auto-approve tfplan

      - name: Terraform Output
        run: |
          cd infrastructure/terraform
          terraform output

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-kubernetes, deploy-terraform]
    if: always()
    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.deploy-kubernetes.result }}" == "success" ] && [ "${{ needs.deploy-terraform.result }}" == "success" ]; then
            echo "Deployment successful!"
            echo "Image: ${{ secrets.DOCKER_USERNAME }}/devsecops-app:${{ github.sha }}"
          else
            echo "Deployment failed!"
            exit 1
          fi
